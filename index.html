<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABT İstanbul | Selected Works</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f1115;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 25px;
            border-bottom: 1px solid #1f2430;
        }
        .site-logo {
            max-width: 280px;
            height: auto;
            margin-bottom: 15px;
            display: inline-block;
        }
        header p {
            color: #00adef;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }
        
        /* Video Izgarası */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        .video-card {
            background: #181b22;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }
        
        /* Thumbnail ve Oynat Alanı */
        .thumb-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background-color: #000;
            cursor: pointer;
            overflow: hidden;
        }
        .thumb-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .video-card:hover .thumb-container img {
            transform: scale(1.05);
        }
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, transform 0.3s ease;
            z-index: 2;
        }
        .play-btn::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 4px;
        }
        .video-card:hover .play-btn {
            background: #00adef;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .thumb-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-info {
            padding: 18px;
        }
        .video-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #e2e8f0;
            line-height: 1.4;
        }

        /* Sayfalama (Pagination) & Butonlar */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #181b22;
            color: #ffffff;
            border: 1px solid #2d3342;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn:hover:not(:disabled) {
            background-color: #00adef;
            border-color: #00adef;
            color: #ffffff;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-info {
            color: #8a99ad;
            font-size: 0.95rem;
        }

        /* İletişim ve Harita Alanı */
        .contact-section {
            background: #181b22;
            border-radius: 16px;
            padding: 40px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .contact-section h2 {
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #ffffff;
            text-align: center;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            font-size: 1.05rem;
            color: #9ab;
        }
        .contact-info div strong {
            color: #fff;
            display: block;
            margin-bottom: 5px;
        }
        .contact-info a {
            color: #00adef;
            text-decoration: none;
        }
        .map-container {
            border-radius: 12px;
            overflow: hidden;
            height: 300px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            color: #566;
            font-size: 0.9rem;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="abt_logo_siyahta.jpg" alt="abt|istanbul" class="site-logo">
            <p>SELECTED WORKS</p>
        </header>

        <!-- Video Izgarası -->
        <div id="video-grid" class="video-grid">
            <div class="loading">Videolar yükleniyor...</div>
        </div>

        <!-- Sayfalama Kontrolleri -->
        <div class="pagination-container" id="pagination-controls" style="display: none;">
            <button class="btn" id="prev-btn" onclick="changePage(-1)">Önceki</button>
            <span class="page-info" id="page-info">Sayfa 1</span>
            <button class="btn" id="next-btn" onclick="changePage(1)">Sonraki</button>
            <button class="btn" id="show-all-btn" onclick="showAllVideos()">Tümünü Göster</button>
        </div>

        <!-- İletişim & Harita -->
        <div class="contact-section">
            <h2>İLETİŞİM & KONUM</h2>
            <div class="contact-grid">
                <div class="contact-info">
                    <div>
                        <strong>Adres:</strong>
                        abt|istanbul<br>
                        Levent, Ortanca Sk. No:6,<br>
                        34330 Beşiktaş / İstanbul
                    </div>
                    <div>
                        <strong>Santral:</strong>
                        <a href="tel:+902122829024">+90 212 282 90 24</a>
                    </div>
                    <div>
                        <strong>E-Posta:</strong>
                        <a href="mailto:it@abtistanbul.com">it@abtistanbul.com</a>
                    </div>
                </div>
                <div class="map-container">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1503.8239013098528!2d29.015262!3d41.0817851!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14cab66eca2ccfef%3A0xf13a6040e1d9ec3d!2sAbt%20%C4%B0stanbul!5e0!3m2!1str!2str!4v1710000000000!5m2!1str!2str" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 ABT İstanbul. Tüm hakları saklıdır.</p>
        </footer>
    </div>

    <script>
        const vimeoUser = 'abtistanbul';
        const apiUrl = `https://vimeo.com/api/v2/${vimeoUser}/videos.json`;

        let allVideos = [];
        let currentPage = 1;
        const itemsPerPage = 9;
        let isShowingAll = false;

        async function fetchVimeoVideos() {
            const grid = document.getElementById('video-grid');
            try {
                const response = await fetch(apiUrl);
                let videos = await response.json();

                if (!Array.isArray(videos) || videos.length === 0) {
                    grid.innerHTML = '<div class="loading">Henüz video bulunamadı.</div>';
                    return;
                }

                // Videoları yayınlanma tarihine göre en yeniden en eskiye sırala
                videos.sort((a, b) => new Date(b.upload_date) - new Date(a.upload_date));
                allVideos = videos;

                document.getElementById('pagination-controls').style.display = 'flex';
                renderPage();
            } catch (error) {
                console.error('Hata:', error);
                grid.innerHTML = '<div class="loading">Videolar yüklenirken bir sorun oluştu.</div>';
            }
        }

        function renderPage() {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            let videosToDisplay = [];
            
            if (isShowingAll) {
                videosToDisplay = allVideos;
            } else {
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                videosToDisplay = allVideos.slice(startIndex, endIndex);
            }

            videosToDisplay.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                const thumbUrl = video.thumbnail_large;

                card.innerHTML = `
                    <div class="thumb-container" onclick="loadIframe(this, '${video.id}')">
                        <img src="${thumbUrl}" alt="${video.title}">
                        <div class="play-btn"></div>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            updatePaginationUI();
        }

        function updatePaginationUI() {
            const totalPages = Math.ceil(allVideos.length / itemsPerPage);
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const pageInfo = document.getElementById('page-info');
            const showAllBtn = document.getElementById('show-all-btn');

            if (isShowingAll) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                pageInfo.innerText = `Toplam ${allVideos.length} Video Gösteriliyor`;
                showAllBtn.innerText = 'Sayfalı Göster';
            } else {
                prevBtn.style.display = 'inline-block';
                nextBtn.style.display = 'inline-block';
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage >= totalPages;
                pageInfo.innerText = `Sayfa ${currentPage} / ${totalPages}`;
                showAllBtn.innerText = 'Tümünü Göster';
            }
        }

        function changePage(direction) {
            currentPage += direction;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showAllVideos() {
            isShowingAll = !isShowingAll;
            currentPage = 1;
            renderPage();
        }

        function loadIframe(element, videoId) {
            element.innerHTML = `
                <iframe 
                    src="https://player.vimeo.com/video/${videoId}?autoplay=1" 
                    allow="autoplay; fullscreen; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }

        fetchVimeoVideos();
    </script>
</body>
</html>
